{% extends "base.html" %}

{% block title %}Page Not Found (404) - RepairDesk{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
  <div class="col-12 col-md-8 col-lg-6 text-center">
    <div class="card border-0 shadow-sm p-4 p-md-5">
      <div class="mb-3">
        <span class="badge bg-secondary-subtle text-secondary fs-6 px-3 py-2 rounded-pill">HTTP 404 Not Found</span>
      </div>
      <h1 class="h3 fw-bold mb-3">Resource Not Found</h1>
      <p class="text-muted mb-4">
        The record, page, or service ticket you requested could not be located or has been moved.
      </p>
      <div>
        <a href="{% url 'home' %}" class="btn btn-primary px-4">
          Return to Dashboard
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
